name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # npx rather than pnpm dlx: pnpm does not run the install scripts of vsce's
      # native dependencies (keytar, vsce-sign) unless they are explicitly allowed.
      - run: npx --yes @vscode/vsce package --out remove-markup-tags.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: remove-markup-tags.vsix
